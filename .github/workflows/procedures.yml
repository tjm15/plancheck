name: Procedural knowledge validation
on:
  push:
    paths: ['knowledge/procedures/**', 'tools/procedure_model.py', 'tests/test_procedure_model.py', 'requirements-procedures.txt', '.github/workflows/procedures.yml']
  pull_request:
    paths: ['knowledge/procedures/**', 'tools/procedure_model.py', 'tests/test_procedure_model.py', 'requirements-procedures.txt', '.github/workflows/procedures.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-procedures.txt
      - run: python -m pip install -r requirements-procedures.txt
      - run: python tools/procedure_model.py validate
      - run: python -m unittest discover -s tests -v
